  clearInterval(poll);clearInterval(S.tick);const p=(location.hash.slice(1).split('?')[0]||'/').split('/').filter(Boolean);window.scrollTo(0,0);if(p[0]!=='login'&&p[0]!=='war')S.need=false;

/* ---------- form klaim ---------- */
async function shrink(file,max,q){const b=await createImageBitmap(file,{imageOrientation:'from-image'});const r=Math.min(1,max/Math.max(b.width,b.height)),w=Math.round(b.width*r),h=Math.round(b.height*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);return new Promise(res=>c.toBlob(res,'image/webp',q))}
async function putFile(folder,blob){const path=`${S.user?S.user.id:'guest'}/${folder}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.webp`;ck(await sb.storage.from('claims').upload(path,blob,{contentType:'image/webp',cacheControl:'31536000'}));return{path,url:sb.storage.from('claims').getPublicUrl(path).data.publicUrl}}
function picker(id){ // pemilih foto dengan preview
  const el=$(id);let file=null;const inp=$('input',el);
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>15*1048576){inp.value='';return toast('Gunakan JPG/PNG/WEBP maksimal 15 MB','bad')}file=f;el.innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Pratinjau"><small>Ketuk untuk ganti foto</small>`;el.append(inp)};
  return()=>file;
}
async function claim(){
  app.innerHTML=`<div class="pg"><div class="wrap"><div class="card"><h2>Claim Reward Balap</h2><p class="sub">Lengkapi data di bawah dengan benar.</p>
  <div class="f"><label>Nama</label><input id="nm" maxlength="60" value="${esc(S.me?.display_name||'')}"></div>
  <div class="f"><label>Username Roblox</label><input id="rb" maxlength="30" placeholder="@username" autocapitalize="off"></div>
  <div class="f"><label>ID Discord</label><input id="dc" maxlength="40" placeholder="contoh: namakamu" value="${esc(S.user?.user_metadata?.full_name||S.user?.user_metadata?.name||'')}"></div>
  <div class="f"><label>Jenis balap</label><div class="chips" id="ch">${Object.keys(S.tpl).map(k=>`<button type="button">${k}</button>`).join('')}</div></div>
  <div class="f"><label>Keterangan</label><textarea id="nt" maxlength="500" placeholder="Pilih jenis balap untuk mengisi template otomatis"></textarea></div>
  <div class="f"><label>Foto kemenangan di podium</label><label class="drop" id="pd">${IC.cam} Ketuk untuk pilih foto podium<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <button class="btn" id="go" style="width:100%">Kirim Klaim</button></div></div></div>`;
  let cat='';const get=picker('#pd');
  $$('#ch button').forEach(b=>b.onclick=()=>{cat=b.textContent;$$('#ch button').forEach(x=>x.classList.toggle('on',x===b));$('#nt').value=S.tpl[cat];$('#nt').focus()});
  $('#go').onclick=async()=>{
    const v=id=>$(id).value.trim(),f=get();
    if(!v('#nm')||!v('#rb')||!v('#dc'))return toast('Nama, username Roblox, dan ID Discord wajib diisi','bad');
    if(!cat)return toast('Pilih jenis balap','bad');if(!v('#nt'))return toast('Keterangan wajib diisi','bad');if(!f)return toast('Foto podium wajib diunggah','bad');
    const b=$('#go');b.disabled=true;b.textContent='Mengirim...';
    try{const up=await putFile('podium',await shrink(f,1600,.82));
      const rid=ck(await sb.rpc('create_claim',{p_name:v('#nm'),p_roblox:v('#rb'),p_discord:v('#dc'),p_category:cat,p_note:v('#nt'),p_podium_url:up.url,p_podium_path:up.path}));remember(rid);
      sb.functions.invoke('notify-claim',{body:{id:rid}}).catch(()=>{});
      location.hash='#/status/'+rid;
    }catch(e){toast('Gagal mengirim: '+e.message,'bad');b.disabled=false;b.textContent='Kirim Klaim'}
  };
}

/* ---------- status ---------- */
async function status(id){
  let last='';
  const draw=async()=>{
    const c=ck(await sb.rpc('get_claim',{p_id:id}));
    if(!c){app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Klaim tidak ditemukan</h2></div></div></div>';return}
    const key=c.status+(c.proof_url||'')+(c.admin_note||'');if(key===last)return;const prev=last;last=key;if(prev)toast('Status klaim diperbarui','good');
    const done=c.status==='done';
    app.innerHTML=`<div class="pg"><div class="wrap"><div class="card"><div class="stt">${c.status==='hold'?HOLD(c):c.status==='rejected'?REJ(c):done?
      `<svg class="okc" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg><h3>Pengiriman Reward Successfull</h3><p>Selamat! Reward ${esc(c.category)} sudah dikirim${c.done_at?' pada '+fd(c.done_at):''}.</p>`:
      `<div class="spin" role="status" aria-label="Menunggu"></div><h3>Mohon menunggu</h3><p>Klaimmu sedang diproses, kurang lebih 1×24 jam.</p><div class="dots"><span></span><span></span><span></span></div>`}</div>
      <div class="sum"><div><span>Waktu kirim</span><span>${fd(c.created_at)}</span></div><div><span>Nama</span><span>${esc(c.name)}</span></div><div><span>Roblox</span><span>${esc(c.roblox)}</span></div><div><span>Discord</span><span>${esc(c.discord)}</span></div><div><span>Jenis</span><span>${esc(c.category)}</span></div><div><span>Status</span><span class="chip ${c.status}">${SL[c.status]}</span></div></div>
      ${done&&c.proof_url?`<b>Bukti pengiriman</b>${c.admin_note?`<p style="margin:4px 0">${esc(c.admin_note)}</p>`:''}<img class="proof" src="${esc(c.proof_url)}" alt="Bukti pengiriman reward">`:''}
      <p class="sub" style="margin-top:14px;font-size:14px">Simpan tautan halaman ini untuk memantau statusmu kapan saja. Halaman diperbarui otomatis.</p>
      <a class="btn ghost" style="width:100%" href="#/klaim">Semua klaimku</a></div></div></div>`;
  };
  await draw();poll=setInterval(()=>draw().catch(()=>{}),5000);
}
async function mine(){
  let rows=[];if(S.user)rows=ck(await sb.from('claims').select('id,category,status,created_at').eq('user_id',S.user.id));
  const have=new Set(rows.map(r=>r.id));
  const extra=await Promise.all(myIds().filter(i=>!have.has(i)).map(async i=>{try{return ck(await sb.rpc('get_claim',{p_id:i}))}catch(e){return null}}));
  const l=[...rows,...extra.filter(Boolean)].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  app.innerHTML=`<div class="pg"><div class="wrap"><h1 style="font-size:32px;margin-bottom:6px">Klaim Saya</h1>${S.user?'':'<p class="sub" style="text-align:left;margin-bottom:14px">Menampilkan klaim dari perangkat ini. <a href="#/login">Masuk</a> agar tersimpan di semua perangkat.</p>'}<div class="tb"><table style="min-width:420px"><thead><tr><th>Waktu</th><th>Jenis</th><th>Status</th><th></th></tr></thead><tbody>${l.map(c=>`<tr><td>${fd(c.created_at)}</td><td>${esc(c.category)}</td><td><span class="chip ${c.status}">${SL[c.status]}</span></td><td><a href="#/status/${c.id}">Lihat</a></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--mu)">Belum ada klaim</td></tr>'}</tbody></table></div></div></div>`;
}

/* ---------- login ---------- */
async function auth(){
  if(S.user)return location.hash='#/';const r=S.reg;
  app.innerHTML=`<div class="pg"><div class="wrap"><div class="card"><h2>${r?'Buat Akun':'Masuk'}</h2><p class="sub">Akun bersifat opsional. Kamu tetap bisa klaim reward tanpa login.</p>${S.need?'<div class="nt" style="margin:0 0 14px">Untuk mengikuti War Robux, kamu harus masuk atau daftar akun dulu.</div>':''}<div class="tabs"><button data-r="0" class="${r?'':'on'}">Masuk</button><button data-r="1" class="${r?'on':''}">Daftar</button></div>
  ${r?'<div class="f"><label>Nama</label><input id="un" maxlength="40"></div>':''}<div class="f"><label>Email</label><input id="em" type="email" autocomplete="email"></div><div class="f"><label>Password (min. 6)</label><input id="pw" type="password" autocomplete="${r?'new-password':'current-password'}"></div>
  <button class="btn" id="go" style="width:100%">${r?'Daftar':'Masuk'}</button>${statBox()}</div></div></div>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{S.reg=b.dataset.r==='1';auth()});
  const go=async()=>{const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||pw.length<6)return toast('Isi email dan password (min. 6)','bad');
    try{if(r){const n=$('#un').value.trim();if(!n)return toast('Nama wajib diisi','bad');const d=ck(await sb.auth.signUp({email:em,password:pw,options:{data:{name:n}}}));if(!d.session){toast('Cek email untuk konfirmasi, lalu masuk','good');S.reg=false;return auth()}}
    else ck(await sb.auth.signInWithPassword({email:em,password:pw}));
    await loadUser();chrome();toast('Selamat datang!','good');const nx=takeNext();location.hash=isAdmin()||isWar()||isOrg()?'#/admin':(nx||'#/')}catch(e){toast(friendly(e),'bad')}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ---------- admin ---------- */
async function tabClaims(){
  if(!isAdmin()){app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Akses ditolak</h2><p class="sub">Halaman khusus admin.</p></div></div></div>';return}
  const all=ck(await sb.from('claims').select('*').order('created_at',{ascending:false}).limit(500));S.all=all;
  const l=all.filter(c=>S.flt==='all'||c.status===S.flt);
  $('#ab').innerHTML=`<div class="sts">${['pending','hold','done','rejected'].map(k=>`<div><span>${SL[k]}</span><b>${all.filter(c=>c.status===k).length}</b></div>`).join('')}<div><span>Total klaim</span><b>${all.length}</b></div></div>
  <div class="fl">${[['all','Semua'],['pending','Menunggu'],['hold','Tertunda'],['done','Berhasil'],['rejected','Ditolak']].map(([k,t])=>`<button data-f="${k}" class="${S.flt===k?'on':''}">${t}</button>`).join('')}</div>
  <div class="tb"><table><thead><tr><th>Tanggal &amp; waktu</th><th>Nama</th><th>Roblox</th><th>Discord</th><th>Jenis</th><th>Status</th><th></th></tr></thead><tbody>${l.map(c=>`<tr><td>${fd(c.created_at)}</td><td>${esc(c.name)}</td><td>${esc(c.roblox)}</td><td>${esc(c.discord)}</td><td>${esc(c.category)}</td><td><span class="chip ${c.status}">${SL[c.status]}</span></td>
  <td><div class="ib"><button data-e="${c.id}" aria-label="Edit klaim ${esc(c.name)}">${IC.edit}</button><button data-d="${c.id}" aria-label="Hapus klaim ${esc(c.name)}">${IC.del}</button></div></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:30px">Belum ada klaim</td></tr>'}</tbody></table></div>`;
  $$('.fl button').forEach(b=>b.onclick=()=>{S.flt=b.dataset.f;admin()});
  $$('[data-e]').forEach(b=>b.onclick=()=>editor(S.all.find(c=>c.id===b.dataset.e)));
  $$('[data-d]').forEach(b=>b.onclick=async()=>{const c=S.all.find(x=>x.id===b.dataset.d);if(!confirm('Hapus klaim '+c.name+' permanen?'))return;
    try{await sb.storage.from('claims').remove([c.proof_path].filter(Boolean));ck(await sb.from('claims').delete().eq('id',c.id));toast('Klaim dihapus');admin()}catch(e){toast(e.message,'bad')}});
}
const SL={pending:'Menunggu',hold:'Tertunda',done:'Berhasil',rejected:'Ditolak'};
const ICO=(cl,p)=>`<svg class="okc ${cl}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path pathLength="60" d="${p}"/></svg>`;
const NOTE=(c,cl)=>c.admin_note?`<div class="nt ${cl}"><b>Catatan admin</b><br>${esc(c.admin_note)}</div>`:'';
const HOLD=c=>`${ICO('w','M50 28v24l14 8')}<h3>Klaim Tertunda</h3><p>Datamu perlu dilengkapi atau diperiksa ulang. Ikuti catatan admin lalu hubungi admin di Discord.</p>${NOTE(c,'')}`;
const REJ=c=>`${ICO('r','M34 34l32 32M66 34L34 66')}<h3>Klaim Ditolak</h3><p>Maaf, klaimmu belum dapat disetujui.</p>${NOTE(c,'r')}`;
function editor(c){
  const close=modal(`<h2>Detail Klaim</h2>
  <div class="kv"><b>Dikirim</b><span>${fd(c.created_at)}</span><b>Nama</b><span>${esc(c.name)}</span><b>Roblox</b><span>${esc(c.roblox)}</span><b>Discord</b><span>${esc(c.discord)}</span><b>Jenis</b><span>${esc(c.category)}</span><b>Status</b><span><span class="chip ${c.status}">${SL[c.status]}</span></span><b>Keterangan</b><span>${esc(c.note)}</span></div>
  <p style="margin:14px 0 0"><b>Foto podium</b></p><a href="${esc(c.podium_url)}" target="_blank" rel="noopener"><img class="pd" src="${esc(c.podium_url)}" alt="Foto podium"></a><hr>
  <h3 style="font-size:20px;margin-bottom:10px">Tindakan</h3>
  <div class="f"><label>Catatan untuk pemain (wajib untuk Tertunda dan Ditolak)</label><textarea id="an">${esc(c.admin_note||'')}</textarea></div>
  <div class="f"><label>Foto bukti pengiriman (wajib untuk Berhasil)</label><label class="drop" id="pf">${c.proof_url?`<img src="${esc(c.proof_url)}" alt="Bukti"><small>Ketuk untuk ganti</small>`:IC.cam+'Ketuk untuk pilih foto bukti'}<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <div class="a3"><button class="btn ok" data-s="done">Berhasil</button><button class="btn warn" data-s="hold">Tertunda</button><button class="btn dn" data-s="rejected">Ditolak</button></div>
  ${c.status!=='pending'?'<button class="btn ghost" id="re" style="width:100%;margin-top:8px">Kembalikan ke Menunggu</button>':''}`);
  const get=picker('#pf');
  $$('.a3 button').forEach(b=>b.onclick=async()=>{const st=b.dataset.s,note=$('#an').value.trim(),f=get();
    if(st!=='done'&&!note)return toast('Isi catatan untuk pemain dulu','bad');
    if(st==='done'&&!f&&!c.proof_url)return toast('Unggah foto bukti pengiriman dulu','bad');
    $$('.a3 button').forEach(x=>x.disabled=true);
    try{const u={status:st,admin_note:note||null,done_at:st==='done'?new Date().toISOString():null};
      if(st==='done'&&f){const up=await putFile('proof',await shrink(f,1600,.82));u.proof_url=up.url;u.proof_path=up.path;if(c.proof_path)sb.storage.from('claims').remove([c.proof_path])}
      ck(await sb.from('claims').update(u).eq('id',c.id));toast('Status diperbarui: '+SL[st],'good');close();admin()}
    catch(e){toast(e.message,'bad');$$('.a3 button').forEach(x=>x.disabled=false)}});
  const re=$('#re');if(re)re.onclick=async()=>{try{ck(await sb.from('claims').update({status:'pending',done_at:null}).eq('id',c.id));close();admin()}catch(e){toast(e.message,'bad')}};
}
/* ---------- statistik realtime ---------- */
const fmtN=n=>Number(n).toLocaleString('id-ID');
const statBox=()=>`<div class="stx"><div><b data-st="reg">${S.reg==null?'-':fmtN(S.reg)}</b><span>Player Terdaftar</span></div><div><b data-st="on">${fmtN(S.on||1)}</b><span><i class="live"></i>Pengguna Aktif</span></div></div>`;
function updStats(){$$('[data-st=reg]').forEach(e=>e.textContent=S.reg==null?'-':fmtN(S.reg));$$('[data-st=on]').forEach(e=>e.textContent=fmtN(S.on||1))}
async function loadReg(){try{S.reg=ck(await sb.rpc('site_stats')).players;updStats()}catch(e){}}
function startPresence(){
  const key=crypto.randomUUID?crypto.randomUUID():String(Math.random()),ch=sb.channel('krc-online',{config:{presence:{key}}});
  ch.on('presence',{event:'sync'},()=>{S.on=Math.max(1,Object.keys(ch.presenceState()).length);updStats()}).subscribe(async st=>{if(st==='SUBSCRIBED')await ch.track({t:Date.now()})});
}

async function getGallery(n){try{return ck(await sb.from('race_gallery').select('*').eq('hidden',false).order('created_at',{ascending:false}).limit(n))}catch(e){return[]}}
async function galleryPage(){

  const [r,mine]=await Promise.all([sb.rpc('list_wars').then(ck),sb.from('war_orders').select('id,war_title,option,status,created_at').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(8).then(ck).catch(()=>[])]);
  const off=Date.parse(r.now)-Date.now(),W=r.wars||[];
  app.innerHTML=`<div class="pg"><div class="wrap"><h1 style="font-size:34px;margin-bottom:6px">War Robux</h1><p class="sub" style="text-align:left">Status berubah otomatis saat war dimulai atau stok habis. Klik kartu untuk membeli saat ONGOING.</p><div class="pgrid wgrid" style="margin-top:20px">${W.map(warCard).join('')||'<p class="sub" style="grid-column:1/-1">Belum ada jadwal war.</p>'}</div>

async function warOrder(id){

      rejected:`${ICO('r','M34 34l32 32M66 34L34 66')}<h3>Pesanan Ditolak</h3><p>Maaf, pesananmu belum dapat disetujui.</p>${NOTE(o,'r')}`,

  };

/* ---------- event kompetisi (mirip Robloxpedia) ---------- */
const lines=t=>(t||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>s.split('|').map(x=>x.trim()));
function compFields(d){const so=(v,t)=>`<option value="${v}" ${d.status===v?'selected':''}>${t}</option>`,ta=(id,l,v,ph)=>`<div class="f"><label>${l}</label><textarea id="${id}" style="min-height:120px;font-size:14px" placeholder="${ph}">${esc(v)}</textarea></div>`,ip=(id,l,v)=>`<div class="f"><label>${l}</label><input id="${id}" maxlength="80" value="${esc(v)}"></div>`;
  const ev=d.end_at?new Date(new Date(d.end_at).getTime()-new Date(d.end_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';
  return `<hr><h3 style="font-size:18px;margin-bottom:10px">Detail Kompetisi</h3><div class="f"><label>Status event</label><select id="cs">${so('upcoming','UPCOMING')}${so('ongoing','ONGOING')}${so('finished','FINISHED')}</select></div>${ip('cb','Dibuat oleh (nama penyelenggara)',d.by)}${ip('cp','Prize pool (mis. Rp 10.000.000)',d.prize)}<div class="f"><label>Tanggal dan jam selesai</label><input id="ce" type="datetime-local" value="${ev}"></div>${ip('ct','Tipe peserta (individual / tim)',d.ptype)}${ip('c1','Juara 1 (Champion)',d.c)}${ip('c2','Juara 2 (Runner Up)',d.r)}${ip('c3','Juara 3 (3rd Place)',d.t)}
  ${ta('cm','Jadwal match (satu per baris). Format: tanggal jam | tahap | ronde | map | grup | jumlah peserta | status (opsional: FINISHED / LIVE / UPCOMING)',d.matches,'2026-09-19 20:00 | Kualifikasi | R1 | Mount Yellow | Group A | 30 | FINISHED')}${ta('cpt','Daftar peserta (satu per baris). Format: nama | @username (opsional)',d.participants,'NamaPeserta | @username')}${ta('cst','Klasemen (satu per baris). Format: tahap | grup | peserta | played | poin | status. Kosongkan grup jika tidak ada, status: QUALIFIED / ELIMINATED (opsional, tetap beri tanda | di akhir)',d.standings,'Semifinal | Group A | NamaPeserta | 3 | 24 | QUALIFIED')}<hr>`}
function readComp(){const v=i=>$(i).value.trim();return{status:v('#cs'),by:v('#cb'),prize:v('#cp'),end_at:$('#ce').value?new Date($('#ce').value).toISOString():'',ptype:v('#ct'),c:v('#c1'),r:v('#c2'),t:v('#c3'),matches:v('#cm'),participants:v('#cpt'),standings:v('#cst')}}
const compBadge=d=>({upcoming:['UPCOMING','next'],ongoing:['ONGOING','live'],finished:['✓ FINISHED','cmp']}[d.status]||['UPCOMING','next']);
function compPage(p){
  const d=p.detail||{},fdd=x=>new Date(x+'T00:00:00+07:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Jakarta'});
  const M=lines(d.matches).map(([dt,stage,round,map,group,cnt,st])=>{const[dd,tm]=(dt||'').split(/\s+/),ok=/^\d{2}:\d{2}$/.test(tm||'');return{dd,tm:ok?tm:'--:--',t:new Date(dd+'T'+(ok?tm:'23:59')+':00+07:00'),stage:stage||'Match',round,map,group,cnt,st:(st||'').toUpperCase()}}).filter(m=>!isNaN(m.t)).sort((a,b)=>a.t-b.t);
  const ms=m=>m.st==='FINISHED'?['FINISHED','done']:m.st==='LIVE'?['LIVE','hold']:m.st==='UPCOMING'?['UPCOMING','k']:Date.now()>m.t.getTime()+36e5?['FINISHED','done']:Date.now()>=m.t.getTime()?['LIVE','hold']:['UPCOMING','k'];
  const days=[...new Set(M.map(m=>m.dd))],P=lines(d.participants),SG={},stages=[];
  const gs=n=>SG[n]||(SG[n]={n,groups:[],ms:[]},stages.push(SG[n]),SG[n]);
  M.forEach(m=>gs(m.stage).ms.push(m));
  lines(d.standings).forEach(a=>{const o=(a.length>=6||(a.length>=5&&a[1]===''))?{st:a[0],gr:a[1],nm:a[2],pd:a[3],pt:a[4],s:(a[5]||'').toUpperCase()}:{st:a[0],gr:'',nm:a[1],pd:a[2],pt:a[3],s:(a[4]||'').toUpperCase()};const g=gs(o.st);let x=g.groups.find(y=>y.n===o.gr);if(!x){x={n:o.gr,rows:[]};g.groups.push(x)}x.rows.push(o)});
  const [bl,bc]=compBadge(d),aw=[['🥇','Champion',d.c],['🥈','Runner Up',d.r],['🥉','3rd Place',d.t]].filter(a=>a[2]);
  const info=(l,v)=>v?`<div class="ci"><span>${l}</span><b>${esc(v)}</b></div>`:'';
  const tbl=g=>`<div class="tb" style="margin-top:10px"><table style="min-width:520px"><thead><tr><th>Rank</th><th>Peserta</th><th>Played</th><th>Total Points</th><th>Status</th></tr></thead><tbody>${g.rows.map((r,i)=>`${i&&g.rows[i-1].s==='QUALIFIED'&&r.s!=='QUALIFIED'?'<tr><td colspan="5" style="text-align:center;color:var(--mu);font-size:12px;background:var(--foam)">Batas Lolos / Cut-off</td></tr>':''}<tr><td><b>#${i+1}</b></td><td><b>${esc(r.nm)}</b></td><td>${esc(r.pd)}</td><td><b>${esc(r.pt)}</b></td><td>${r.s?`<span class="chip ${r.s==='QUALIFIED'?'done':'rejected'}">${esc(r.s)}</span>`:'-'}</td></tr>`).join('')}</tbody></table></div>`;
  const stg=(s,i)=>{const fin=s.ms.filter(m=>ms(m)[0]==='FINISHED').length,gl=[...s.groups];s.ms.forEach(m=>{if(m.group&&!gl.find(g=>g.n===m.group))gl.push({n:m.group,rows:[]})});
    return `<div class="cc"><div class="stg"><i>${i+1}</i><div><h2>${esc(s.n)}</h2>${s.ms.length?`<small>${fin}/${s.ms.length} Selesai</small>`:''}</div></div>${gl.map(g=>{const mm=s.ms.filter(m=>m.group===g.n),st=mm.length?ms(mm[mm.length-1]):null;return `<div style="margin-top:14px">${g.n?`<h3 style="font-size:18px">${esc(g.n)}${mm[0]&&mm[0].map?` <small style="color:var(--mu);font-family:var(--fb);font-weight:600">· ${esc(mm[0].map)}</small>`:''} ${!g.rows.length&&st?`<span class="chip ${st[1]}">${st[0]}</span>`:''}</h3>`:''}${g.rows.length?tbl(g):''}</div>`}).join('')}</div>`};
  app.innerHTML=`<div class="pg"><div class="wrap"><a href="#/event" style="color:var(--co);font-weight:700;text-decoration:none">← Kembali</a>
  ${p.image_url?`<img class="cb" src="${esc(p.image_url)}" alt="${esc(p.title)}">`:''}<div style="margin:16px 0 6px"><span class="wb ${bc}" style="position:static">${bl}</span></div><h1 style="font-size:clamp(30px,5vw,46px);margin-bottom:18px">${esc(p.title)}</h1>
  <div class="cp"><div>
  <div class="cc"><h2>Tentang Kompetisi</h2><div class="bd" style="margin-top:10px">${esc(p.body||p.summary||'')}</div><p class="sub" style="text-align:left;margin:12px 0 0;font-size:14px">Dibuat oleh: <b>${esc(d.by||'KRC Community')}</b> · ${fdd(p.created_at.slice(0,10))}${d.ptype?' · Tipe: <b>'+esc(d.ptype)+'</b>':''}</p></div>
  ${aw.length?`<div class="cc"><h2>Awards</h2><div class="aw">${aw.map(a=>`<div><i>${a[0]}</i><small>${a[1]}</small><b>${esc(a[2])}</b></div>`).join('')}</div></div>`:''}
  ${M.length?`<div class="cc"><h2>Jadwal Match</h2><p class="sub" style="text-align:left;margin:0 0 12px">${M.length} match</p><div class="tt" id="dt">${days.map((x,i)=>`<button data-i="${i}" class="${i?'':'on'}">DAY ${i+1}</button>`).join('')}</div>${days.map((x,i)=>`<div class="dp" data-i="${i}" ${i?'hidden':''}><p style="font-weight:700;margin:6px 0">${fdd(x)}</p>${M.filter(m=>m.dd===x).map(m=>{const[a,c]=ms(m);return`<div class="mt"><b class="mtm">${m.tm}<small>WIB</small></b><div style="flex:1"><b>${esc(m.stage)}${m.round?' · '+esc(m.round):''}</b> <span class="chip ${c}">${a}</span><br><small style="color:var(--mu)">${m.map?'🗺 '+esc(m.map).toUpperCase():''}</small><br><small style="color:var(--mu)">${esc(m.group||'')}${m.cnt?' · '+esc(m.cnt)+' Peserta':''}</small></div></div>`}).join('')}</div>`).join('')}<p class="sub" style="text-align:left;font-size:13px;margin:8px 0 0">*Jadwal dapat berubah sewaktu-waktu.</p></div>`:''}
  ${stages.map(stg).join('')}
  </div><aside><div class="cc">${info('Prize Pool',d.prize)}${info('Tanggal Mulai',p.event_date?fday(p.event_date)+' · '+ftime(p.event_date)+' WIB':'')}${info('Tanggal Selesai',d.end_at?fday(d.end_at)+' · '+ftime(d.end_at)+' WIB':'')}${info('Tipe Peserta',d.ptype)}${info('Lokasi',p.location)}</div>
  ${P.length?`<div class="cc"><h2>Peserta <span class="chip k">${P.length}</span></h2><div class="pls">${P.map(x=>`<div class="pr2"><span class="av">${esc((x[0]||'?').slice(0,2).toUpperCase())}</span><span><b>${esc(x[0])}</b>${x[1]?`<small>${esc(x[1])}</small>`:''}</span></div>`).join('')}</div></div>`:''}</aside></div></div></div>`;
  $$('#dt button').forEach(b=>b.onclick=()=>{$$('#dt button').forEach(x=>x.classList.toggle('on',x===b));$$('.dp').forEach(x=>x.hidden=x.dataset.i!==b.dataset.i)});
}
