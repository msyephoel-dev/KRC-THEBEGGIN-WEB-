async function shrink(file,max,q){const b=await createImageBitmap(file,{imageOrientation:'from-image'});const r=Math.min(1,max/Math.max(b.width,b.height)),w=Math.round(b.width*r),h=Math.round(b.height*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);return new Promise(res=>c.toBlob(res,'image/webp',q))}
async function putFile(folder,blob){const path=`${S.user?S.user.id:'guest'}/${folder}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.webp`;ck(await sb.storage.from('claims').upload(path,blob,{contentType:'image/webp',cacheControl:'31536000'}));return{path,url:sb.storage.from('claims').getPublicUrl(path).data.publicUrl}}
function picker(id){ // pemilih foto dengan preview
  const el=$(id);let file=null;const inp=$('input',el);
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>15*1048576){inp.value='';return toast('Gunakan JPG/PNG/WEBP maksimal 15 MB','bad')}file=f;el.innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Pratinjau"><small>Ketuk untuk ganti foto</small>`;el.append(inp)};
  return()=>file;
}

/* ---------- status ---------- */
async function status(id){
  let last='';
  const draw=async()=>{
    const c=ck(await sb.rpc('get_claim',{p_id:id}));
    if(!c){app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Klaim tidak ditemukan</h2></div></div></div>';return}
    const key=c.status+(c.proof_url||'')+(c.admin_note||'');if(key===last)return;const prev=last;last=key;if(prev)toast('Status klaim diperbarui','good');
    const done=c.status==='done';
    app.innerHTML=`<div class="pg"><div class="wrap"><div class="card"><div class="stt">${c.status==='hold'?HOLD(c):c.status==='rejected'?REJ(c):done?
      `<svg class="okc" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg><h3>Pengiriman Reward Successfull</h3><p>Selamat! Reward ${esc(c.category)} sudah dikirim${c.done_at?' pada '+fd(c.done_at):''}.</p>`:
      `<div class="spin" role="status" aria-label="Menunggu"></div><h3>Mohon menunggu</h3><p>Klaimmu sedang diproses, kurang lebih 1×24 jam.</p><div class="dots"><span></span><span></span><span></span></div>`}</div>
      <div class="sum"><div><span>Waktu kirim</span><span>${fd(c.created_at)}</span></div><div><span>Nama</span><span>${esc(c.name)}</span></div><div><span>Roblox</span><span>${esc(c.roblox)}</span></div><div><span>Discord</span><span>${esc(c.discord)}</span></div><div><span>Jenis</span><span>${esc(c.category)}</span></div><div><span>Status</span><span class="chip ${c.status}">${SL[c.status]}</span></div></div>
      ${done&&c.proof_url?`<b>Bukti pengiriman</b>${c.admin_note?`<p style="margin:4px 0">${esc(c.admin_note)}</p>`:''}<img class="proof" src="${esc(c.proof_url)}" alt="Bukti pengiriman reward">`:''}
      <p class="sub" style="margin-top:14px;font-size:14px">Simpan tautan halaman ini untuk memantau statusmu kapan saja. Halaman diperbarui otomatis.</p>
      <a class="btn ghost" style="width:100%" href="#/klaim">Semua klaimku</a></div></div></div>`;
  };
  await draw();poll=setInterval(()=>draw().catch(()=>{}),5000);
}
async function mine(){
  let rows=[];if(S.user)rows=ck(await sb.from('claims').select('id,category,status,created_at').eq('user_id',S.user.id));

function editor(c){

  ${c.status!=='pending'?'<button class="btn ghost" id="re" style="width:100%;margin-top:8px">Kembalikan ke Menunggu</button>':''}`);
  const get=picker('#pf');
  $$('.a3 button').forEach(b=>b.onclick=async()=>{const st=b.dataset.s,note=$('#an').value.trim(),f=get();
    if(st!=='done'&&!note)return toast('Isi catatan untuk pemain dulu','bad');
    if(st==='done'&&!f&&!c.proof_url)return toast('Unggah foto bukti pengiriman dulu','bad');

    try{const u={status:st,admin_note:note||null,done_at:st==='done'?new Date().toISOString():null};

    catch(e){toast(e.message,'bad');$$('.a3 button').forEach(x=>x.disabled=false)}});
  const re=$('#re');if(re)re.onclick=async()=>{try{ck(await sb.from('claims').update({status:'pending',done_at:null}).eq('id',c.id));close();admin()}catch(e){toast(e.message,'bad')}};
}

async function loadSet(){S.set=ck(await sb.from('site_settings').select('*').eq('id',1).maybeSingle())||{}}
async function getPosts(kind,n){try{return ck(await sb.from('posts').select('*').eq('kind',kind).eq('published',true).order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(n))}catch(e){return[]}}
const pdate=p=>fd(p.kind==='event'&&p.event_date?p.event_date:p.created_at);
const pcard=p=>`<a class="pc" href="#/post/${p.id}"><div class="pi">${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="">`:`<span class="ph">${LOGO}</span>`}${p.pinned?'<span class="pin">Disematkan</span>':''}</div><div class="pb"><span class="chip k">${p.kind==='event'?'Event':'Update'}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p><small>${pdate(p)}${p.location?' · '+esc(p.location):''}</small></div></a>`;
async function home(){
  const h={...HD,...Object.fromEntries(Object.entries(S.set).filter(([k,v])=>v&&k in HD))};
  const [ev,up,gl]=await Promise.all([getPosts('event',3),getPosts('update',4),getGallery(6)]);
  const opt=(href,ic,t,d)=>`<a class="ft" href="${href}"><i>${IC[ic]}</i><h3>${t}</h3><p>${d}</p></a>`;
  app.innerHTML=`<section class="hx" style="background-image:url('${esc(h.hero_image_url)}')"><div class="wrap"><span class="bdg">${esc(h.hero_badge)}</span><h1>${esc(h.hero_title)}<br><em>${esc(h.hero_accent)}</em></h1><p>${esc(h.hero_text)}</p><div class="cta"><a class="btn" href="#/event">Lihat Event</a><a class="btn ghost" href="#/claim">Claim Reward Balap</a></div></div></section>
  <div class="hm"><div class="wrap"><div class="gr opt">${opt('#/event','cal','Info Event','Jadwal dan detail event balap komunitas.')}${opt('#/update','mega','Info Update','Pengumuman dan kabar terbaru dari KRC.')}${opt('#/galeri','img','Galeri Balap','Foto podium para pemenang balap KRC.')}${opt('#/war','bolt','War Robux','Jadwal, stok, dan status war Robux KRC.')}${opt('#/claim','cup','Claim Reward Balap','Menang balap? Klaim rewardmu di sini.')}</div>${statBox()}
  <div class="sh"><h2>Event Terbaru</h2><a href="#/event">Lihat semua</a></div><div class="pgrid">${ev.map(pcard).join('')||'<p class="sub" style="grid-column:1/-1">Belum ada event.</p>'}</div>
  <div class="sh"><h2>Galeri Balap</h2><a href="#/galeri">Lihat semua</a></div><div class="gs">${gl.map(g=>`<a href="#/galeri"><img loading="lazy" src="${esc(g.image_url)}" alt="Podium ${esc(g.category)}"></a>`).join('')||'<p class="sub" style="grid-column:1/-1">Belum ada foto.</p>'}</div>
  <div class="sh"><h2>Info Update</h2><a href="#/update">Lihat semua</a></div>${up.map(p=>`<a class="ur" href="#/post/${p.id}"><span><b>${esc(p.title)}</b><small>${pdate(p)}</small></span><span class="chip k">Update</span></a>`).join('')||'<p class="sub">Belum ada update.</p>'}</div></div>`;
}
async function listPage(kind){
  const l=await getPosts(kind,60),t=kind==='event'?'Info Event':'Info Update';
  app.innerHTML=`<div class="pg"><div class="wrap"><h1 style="font-size:34px;margin-bottom:6px">${t}</h1><p class="sub" style="text-align:left">${kind==='event'?'Semua event dan jadwal komunitas KRC.':'Pengumuman dan kabar terbaru dari KRC.'}</p><div class="pgrid" style="margin-top:20px">${l.map(pcard).join('')||'<p class="sub" style="grid-column:1/-1">Belum ada data.</p>'}</div></div></div>`;
}
async function postPage(id){
  const p=ck(await sb.from('posts').select('*').eq('id',id).maybeSingle());
  if(!p){app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Tidak ditemukan</h2></div></div></div>';return}
  app.innerHTML=`<div class="pg"><div class="wrap pp"><a href="#/${p.kind}" style="color:var(--co);font-weight:700;text-decoration:none">Kembali ke ${p.kind==='event'?'Info Event':'Info Update'}</a><h1>${esc(p.title)}</h1><div><span class="chip k">${p.kind==='event'?'Event':'Update'}</span> <small style="color:var(--mu)">${pdate(p)}${p.location?' · '+esc(p.location):''}</small></div>${p.image_url?`<img class="cv" src="${esc(p.image_url)}" alt="${esc(p.title)}">`:''}<div class="bd">${esc(p.body||p.summary||'')}</div></div></div>`;
}

/* ---------- admin (tab) ---------- */
function modal(html){const m=document.createElement('div');m.id='mod';document.body.style.overflow='hidden';m.innerHTML=`<div class="mb"><button class="x" id="xc" aria-label="Tutup">✕</button>${html}</div>`;document.body.append(m);const close=()=>{m.remove();document.body.style.overflow=''};$('#xc').onclick=close;m.onclick=e=>{if(e.target===m)close()};return close}
async function admin(){
  if(!isAdmin()&&!isWar()){app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Akses ditolak</h2><p class="sub">Halaman khusus admin.</p></div></div></div>';return}
  const T=[['claims','Klaim Reward'],['event','Info Event'],['update','Info Update'],['gallery','Galeri Balap'],['hero','Tampilan Beranda']],T2=isWar()?[['war','War Robux']]:T;if(!T2.find(t=>t[0]===S.tab))S.tab=T2[0][0];
  app.innerHTML=`<div class="pg"><div class="wrap"><h1 style="font-size:32px">Dashboard Admin</h1><div class="tt">${T2.map(([k,t])=>`<button data-k="${k}" class="${S.tab===k?'on':''}">${t}</button>`).join('')}</div><div id="ab"></div></div></div>`;
  $$('.tt button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.k;admin()});
  try{if(S.tab==='claims')await tabClaims();else if(S.tab==='hero')await tabHero();else if(S.tab==='gallery')await tabGallery();else if(S.tab==='war')await tabWar();else await tabPosts(S.tab)}catch(e){$('#ab').innerHTML='<div class="card"><p class="sub">'+esc(e.message)+'</p></div>'}
}
async function tabPosts(kind){
  const l=ck(await sb.from('posts').select('*').eq('kind',kind).order('created_at',{ascending:false})),nm=kind==='event'?'Event':'Update';
  $('#ab').innerHTML=`<div style="margin-bottom:12px"><button class="btn sm" id="np">Tambah ${nm}</button></div><div class="tb"><table style="min-width:620px"><thead><tr><th>Judul</th><th>${kind==='event'?'Tanggal event':'Dibuat'}</th><th>Status</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td>${esc(p.title)}</td><td>${pdate(p)}</td><td><span class="chip ${p.published?'done':''}">${p.published?'Tayang':'Draft'}</span></td><td><div class="ib"><button data-e="${p.id}" aria-label="Edit ${esc(p.title)}">${IC.edit}</button><button data-d="${p.id}" aria-label="Hapus ${esc(p.title)}">${IC.del}</button></div></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--mu);padding:30px">Belum ada data</td></tr>'}</tbody></table></div>`;
  $('#np').onclick=()=>postEditor(kind,null);
  $$('[data-e]').forEach(b=>b.onclick=()=>postEditor(kind,l.find(x=>x.id===b.dataset.e)));
  $$('[data-d]').forEach(b=>b.onclick=async()=>{const p=l.find(x=>x.id===b.dataset.d);if(!confirm('Hapus "'+p.title+'" permanen?'))return;try{if(p.image_path)await sb.storage.from('claims').remove([p.image_path]);ck(await sb.from('posts').delete().eq('id',p.id));toast('Dihapus');admin()}catch(e){toast(e.message,'bad')}});
}
function postEditor(kind,p){
  p=p||{};const ev=kind==='event';
  const dv=p.event_date?new Date(new Date(p.event_date).getTime()-new Date(p.event_date).getTimezoneOffset()*60000).toISOString().slice(0,16):'';
  const close=modal(`<h2>${p.id?'Edit':'Tambah'} ${ev?'Event':'Update'}</h2>
  <div class="f"><label>Judul</label><input id="pt" maxlength="120" value="${esc(p.title)}"></div>
  <div class="f"><label>Ringkasan (tampil di kartu)</label><input id="ps" maxlength="200" value="${esc(p.summary)}"></div>
  <div class="f"><label>Isi lengkap</label><textarea id="pb" style="min-height:160px">${esc(p.body)}</textarea></div>
  ${ev?`<div class="f"><label>Tanggal dan jam event</label><input id="pd" type="datetime-local" value="${dv}"></div><div class="f"><label>Lokasi</label><input id="pl" maxlength="80" value="${esc(p.location)}"></div>`:''}
  <div class="f"><label>Gambar</label><label class="drop" id="pi">${p.image_url?`<img src="${esc(p.image_url)}" alt=""><small>Ketuk untuk ganti</small>`:IC.cam+'Ketuk untuk pilih gambar'}<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <label class="ck"><input type="checkbox" id="pp" ${p.pinned?'checked':''}> Sematkan di bagian atas</label><label class="ck"><input type="checkbox" id="pu" ${p.published!==false?'checked':''}> Tayangkan di website</label>
  <button class="btn" id="sv" style="width:100%;margin-top:12px">Simpan</button>`);
  const get=picker('#pi');
  $('#sv').onclick=async()=>{const t=$('#pt').value.trim();if(!t)return toast('Judul wajib diisi','bad');const b=$('#sv');b.disabled=true;b.textContent='Menyimpan...';
    try{const row={kind,title:t,summary:$('#ps').value.trim(),body:$('#pb').value.trim(),pinned:$('#pp').checked,published:$('#pu').checked};
      if(ev){row.event_date=$('#pd').value?new Date($('#pd').value).toISOString():null;row.location=$('#pl').value.trim()}
      const f=get();if(f){const up=await putFile('post',await shrink(f,1600,.82));row.image_url=up.url;row.image_path=up.path;if(p.image_path)sb.storage.from('claims').remove([p.image_path])}
      ck(p.id?await sb.from('posts').update(row).eq('id',p.id):await sb.from('posts').insert(row));toast('Tersimpan dan langsung tayang','good');close();admin()}
    catch(e){toast(e.message,'bad');b.disabled=false;b.textContent='Simpan'}};
}
async function tabHero(){
  const h={...HD,...Object.fromEntries(Object.entries(S.set).filter(([k,v])=>v&&k in HD))};
  $('#ab').innerHTML=`<div class="card" style="max-width:640px"><h2 style="font-size:24px">Tampilan Beranda</h2>
  <div class="f"><label>Label kecil</label><input id="hb" maxlength="40" value="${esc(h.hero_badge)}"></div><div class="f"><label>Judul (putih)</label><input id="ht" maxlength="40" value="${esc(h.hero_title)}"></div>
  <div class="f"><label>Judul (biru)</label><input id="ha" maxlength="40" value="${esc(h.hero_accent)}"></div><div class="f"><label>Teks pengantar</label><textarea id="hx">${esc(h.hero_text)}</textarea></div>
  <div class="f"><label>Gambar latar beranda</label><label class="drop" id="hi"><img src="${esc(h.hero_image_url)}" alt=""><small>Ketuk untuk ganti gambar</small><input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <button class="btn" id="hs" style="width:100%">Simpan</button></div>`;
  const get=picker('#hi');
  $('#hs').onclick=async()=>{const b=$('#hs');b.disabled=true;b.textContent='Menyimpan...';
    try{const row={id:1,hero_badge:$('#hb').value.trim(),hero_title:$('#ht').value.trim(),hero_accent:$('#ha').value.trim(),hero_text:$('#hx').value.trim()};
      const f=get();if(f){const up=await putFile('hero',await shrink(f,1920,.82));row.hero_image_url=up.url}
      ck(await sb.from('site_settings').upsert(row));await loadSet();toast('Beranda diperbarui','good')}catch(e){toast(e.message,'bad')}b.disabled=false;b.textContent='Simpan'};
}


const DCI=`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 7.2c2.2-1 6.8-1 9 0 1.3 2.2 2.1 4.6 2.3 7.4-1.4 1.1-2.8 1.8-4.2 2.2l-.9-1.5M7.5 7.2c-1.3 2.2-2.1 4.6-2.3 7.4 1.4 1.1 2.8 1.8 4.2 2.2l.9-1.5M9.5 15.6c1.6.6 3.4.6 5 0"/><circle cx="9.6" cy="12.2" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.4" cy="12.2" r="1.1" fill="currentColor" stroke="none"/></svg>`;
const isWar=()=>S.me&&S.me.role==='war_admin';S.tick=null;
const WST={live:['BERLANGSUNG','live'],next:['NEXT WAR','next'],soldout:['SOLD OUT','sold']};
const fdl=d=>new Date(d).toLocaleString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'})+' WIB';
async function warPage(){
  clearInterval(S.tick);clearInterval(poll);
  const r=ck(await sb.rpc('list_wars')),off=Date.parse(r.now)-Date.now(),W=r.wars||[];
  const eff=w=>w.effective==='live'&&w.stock<=0?'soldout':w.effective;
  app.innerHTML=`<div class="pg"><div class="wrap"><h1 style="font-size:34px;margin-bottom:6px">War Robux</h1><p class="sub" style="text-align:left">Jadwal dan stok war Robux KRC. Status berubah otomatis saat waktu war tiba.</p><div class="pgrid wgrid" style="margin-top:20px">${W.map(w=>{const s=eff(w),[lb,cl]=WST[s]||WST.next;return `<div class="pc"><div class="pi">${w.image_url?`<img loading="lazy" src="${esc(w.image_url)}" alt="">`:`<span class="ph">${LOGO}</span>`}<span class="wb ${cl}">${lb}</span></div><div class="pb"><h3>${esc(w.title)}</h3><p>${esc(w.description||'')}</p><div class="wst"><span>Stok</span><b>${fmtN(w.stock)} Robux</b></div>${s==='next'&&w.start_at?`<div class="wst"><span>Mulai</span><b style="text-align:right">${fdl(w.start_at)}</b></div><div class="cd" data-t="${Date.parse(w.start_at)}"></div>`:''}</div></div>`}).join('')||'<p class="sub" style="grid-column:1/-1">Belum ada jadwal war.</p>'}</div></div></div>`;
  const tick=()=>{const now=Date.now()+off;let fire=false;$$('.cd').forEach(e=>{const d=+e.dataset.t-now;if(d<=0){fire=true;e.textContent='Segera dimulai...';return}const s=Math.floor(d/1e3);e.innerHTML=[['Hari',Math.floor(s/86400)],['Jam',Math.floor(s%86400/3600)],['Menit',Math.floor(s%3600/60)],['Detik',s%60]].map(([l,v])=>`<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`).join('')});if(fire){clearInterval(S.tick);clearInterval(poll);setTimeout(()=>warPage().catch(()=>{}),1500)}};
  tick();S.tick=setInterval(tick,1000);poll=setInterval(()=>{if(!document.hidden)warPage().catch(()=>{})},15000);
}
async function tabWar(){
  const [l,tg]=await Promise.all([sb.from('wars').select('*').order('created_at',{ascending:false}).then(ck),sb.rpc('war_targets').then(ck)]);
  const nm=Object.fromEntries(tg.map(t=>[t.id,t.display_name||t.id.slice(0,6)]));
  $('#ab').innerHTML=`<div style="margin-bottom:12px"><button class="btn sm" id="nw">Tambah War</button></div><div class="tb"><table style="min-width:760px"><thead><tr><th>Judul</th><th>Status</th><th>Mulai</th><th>Stok</th><th>Target (rahasia)</th><th></th></tr></thead><tbody>${l.map(w=>`<tr><td>${esc(w.title)}${w.published?'':' <span class="chip">Draft</span>'}</td><td><span class="wb ${WST[w.status][1]}" style="position:static">${WST[w.status][0]}</span></td><td>${w.start_at?fdl(w.start_at):'-'}</td><td>${fmtN(w.stock)}</td><td>${w.target_user_id?esc(nm[w.target_user_id]||'-'):'Terbuka umum'}</td><td><div class="ib"><button data-e="${w.id}" aria-label="Edit ${esc(w.title)}">${IC.edit}</button><button data-d="${w.id}" aria-label="Hapus ${esc(w.title)}">${IC.del}</button></div></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--mu);padding:30px">Belum ada war</td></tr>'}</tbody></table></div>`;
  $('#nw').onclick=()=>warEditor(null,tg);
  $$('[data-e]').forEach(b=>b.onclick=()=>warEditor(l.find(x=>x.id===b.dataset.e),tg));
  $$('[data-d]').forEach(b=>b.onclick=async()=>{const w=l.find(x=>x.id===b.dataset.d);if(!confirm('Hapus war "'+w.title+'"?'))return;try{if(w.image_path)await sb.storage.from('claims').remove([w.image_path]);ck(await sb.from('wars').delete().eq('id',w.id));toast('War dihapus');admin()}catch(e){toast(e.message,'bad')}});
}
function warEditor(w,tg){
  w=w||{status:'next',published:true,stock:0};
  const dv=w.start_at?new Date(new Date(w.start_at).getTime()-new Date(w.start_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';
  const close=modal(`<h2>${w.id?'Edit':'Tambah'} War Robux</h2>
  <div class="f"><label>Judul war</label><input id="wt" maxlength="100" value="${esc(w.title)}"></div>
  <div class="f"><label>Deskripsi</label><textarea id="wd">${esc(w.description)}</textarea></div>
  <div class="f"><label>Stok (Robux)</label><input id="ws" type="number" min="0" value="${esc(w.stock)}"></div>
  <div class="f"><label>Status</label><select id="wst"><option value="next" ${w.status==='next'?'selected':''}>NEXT WAR</option><option value="live" ${w.status==='live'?'selected':''}>BERLANGSUNG</option><option value="soldout" ${w.status==='soldout'?'selected':''}>SOLD OUT</option></select></div>
  <div class="f"><label>Tanggal dan jam war (WIB)</label><input id="wa" type="datetime-local" value="${dv}"><small style="color:var(--mu)">Untuk NEXT WAR: saat jam ini tiba, war otomatis berubah menjadi BERLANGSUNG di website.</small></div>
  <div class="f"><label>Target pemenang (opsional, rahasia)</label><select id="wg"><option value="">Tanpa target (terbuka untuk umum)</option>${tg.map(t=>`<option value="${t.id}" ${t.id===w.target_user_id?'selected':''}>${esc(t.display_name||t.id.slice(0,6))}</option>`).join('')}</select><small style="color:var(--mu)">Hanya terlihat oleh Admin War. Tidak ditampilkan di website.</small></div>
  <div class="f"><label>Gambar</label><label class="drop" id="wi">${w.image_url?`<img src="${esc(w.image_url)}" alt=""><small>Ketuk untuk ganti</small>`:IC.cam+'Ketuk untuk pilih gambar'}<input type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
  <label class="ck"><input type="checkbox" id="wp" ${w.published!==false?'checked':''}> Tayangkan di website</label>
  <button class="btn" id="sv" style="width:100%;margin-top:12px">Simpan</button>`);
  const get=picker('#wi');
  $('#sv').onclick=async()=>{const t=$('#wt').value.trim(),st=$('#wst').value;if(!t)return toast('Judul wajib diisi','bad');if(st==='next'&&!$('#wa').value)return toast('NEXT WAR wajib punya tanggal dan jam','bad');
    const b=$('#sv');b.disabled=true;b.textContent='Menyimpan...';
    try{const row={title:t,description:$('#wd').value.trim(),stock:Math.max(0,parseInt($('#ws').value,10)||0),status:st,start_at:$('#wa').value?new Date($('#wa').value).toISOString():null,target_user_id:$('#wg').value||null,published:$('#wp').checked};
      const f=get();if(f){const up=await putFile('war',await shrink(f,1600,.82));row.image_url=up.url;row.image_path=up.path;if(w.image_path)sb.storage.from('claims').remove([w.image_path])}
      ck(w.id?await sb.from('wars').update(row).eq('id',w.id):await sb.from('wars').insert(row));toast('War tersimpan','good');close();admin()}
    catch(e){toast(e.message,'bad');b.disabled=false;b.textContent='Simpan'}};
}
const setNext=hh=>{try{localStorage.setItem('krc_next',JSON.stringify({h:hh,t:Date.now()}))}catch(e){}};
function takeNext(){try{const v=JSON.parse(localStorage.getItem('krc_next')||'null');localStorage.removeItem('krc_next');return v&&Date.now()-v.t<6e5?v.h:null}catch(e){return null}}
/* ---------- init ---------- */
async function loadUser(){const {data:{session}}=await sb.auth.getSession();S.user=session?session.user:null;S.me=S.user?ck(await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle()):null}
(async function(){
  if(!sb){chrome();app.innerHTML='<div class="pg"><div class="wrap"><div class="card"><h2>Hubungkan Supabase</h2><p>Isi <code>CFG.URL</code> dan <code>CFG.KEY</code> di bagian script file ini, lalu muat ulang.</p></div></div></div>';return}
  try{await loadUser()}catch(e){}try{await loadSet()}catch(e){}if(S.user&&!(isAdmin()||isWar())){const nx=takeNext();if(nx)location.hash=nx}
  chrome();
  startPresence();loadReg();setInterval(loadReg,30000);sb.channel('admin-claims').on('postgres_changes',{event:'INSERT',schema:'public',table:'claims'},p=>{if(isAdmin()){toast('Klaim baru dari '+p.new.name,'good');if(location.hash.startsWith('#/admin'))admin()}}).subscribe();
  window.addEventListener('hashchange',route);route();
})();
</script></body></html>
